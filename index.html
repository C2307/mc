<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <link rel="icon" href="favicon.ico">

  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Two+Tone" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=yes">
</style>
  <style>
    .wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
    }

    #header {
        font-size: 12px;
        font-family: Consolas;
        border-radius: 2em;
        backdrop-filter: blur(33px);
        background-color: var(--white-alpha-10);
        bottom: 10px;
        box-shadow: rgba(0, 0, 0, .2) 0 0 10px;
        left: 50%;
        max-width: calc(100% - 20px);
        overflow: hidden;
        padding: 10px;
        position: fixed;
        transform: translate(-50%);
        transition: .25s;
        white-space: nowrap;
    }
    </style>
  <style>
p.margin
{
	margin-top:50px;
}
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif !important;
    color: #000000;
    margin: 0 auto !important;
}

table{

  margin: 0 auto;
	width: 80%;
  text-align: center;
    background-color: #9576eb;
    border-radius: 10px;
    border-collapse: collapse;
}
#myForm, input, button, img, th{
	padding: 6px;	
  border-radius: 10px;
}
th{
    background-color: #9576eb;
}
tr{
	background-color: #fff;
    border-bottom-style: dotted;
    border-bottom-color: #9576eb;	
}
tr:nth-of-type(odd) {
    background: rgb(255 255 255 / 74%);
}
tr:hover {
    background-color: #6750A4;
}
</style>
</head>

<div style="text-align: center;">
	<h1>你好！</h1>
	<img loading="lazy" src="https://list.mczfw.cn/mc/07s.top.png"/>
	<p>
	<a>查一下服务器状态？</a>

  <form id="myForm">
    <div style="width: 33%; position: absolute;left: 50%;transform: translateX(-50%);">
    <mdui-text-field clearable name="ip" label="服务器地址" value="07s.top" inputmode="url">
    </mdui-text-field>
    </div>
    <br></br><br></br>
    <mdui-button type="submit" icon="search" form="myForm">查询
    </mdui-button>

    <mdui-button type="reset" icon="refresh" variant="tonal" onclick="location.reload()">重置
    </mdui-button>
  </form>
</div>
<div id="data" style="text-align: center;">请稍后…</div>
 <div class="wrapper">
  <div id="header">
    Apis: by mczfw.cn | Style: Matrial-Web by Google
  </div>
    </div>



<script>
  const a = document.getElementById('data');
  async function fetchData() {
      try {
          const response = await fetch('https://list.mczfw.cn/api');
          const data = await response.json();
          displayData(data)
      } catch (error) {
          console.error('Fail：', error)
      }
  }
  function displayData(data) {
      let html = '<table><thead><tr><th>Logo</th><th>IP</th><th>MOTD</th></tr></thead>';
      for (let item of data) {
          html += `<tr><td><img src="${item.logo}"></td><td>${item.ip}</td><td>${item.motd}</td></li></tr>`
      }
      html += '</table>';
      a.innerHTML = html
  }
  fetchData();
  document.addEventListener('DOMContentLoaded', function() {
      const form = document.getElementById('myForm');
      form.addEventListener('submit', function(event) {
          event.preventDefault();
          const ipInput = document.querySelector('mdui-text-field[name="ip"]');
          const ip = ipInput.value;
          const url = 'https://list.mczfw.cn/api/' + encodeURIComponent(ip);
          fetch(url).then(response => {
              if (!response.ok) {
                  throw new Error('Network response was not ok.');
              }
              return response.json()
          }).then(data => {
              a.innerHTML = `<table><thead><tr><th>Logo</th><th>Online</th><th>Mods</th><th>MOTD</th></tr></thead><tr><td><img src="${data.logo}"></td><td>${data.p}/${data.mp}</td><td>${data.mod}</td><td>${data.motd}</td></li></tr></table>`
          })
      })
  });
</script>
